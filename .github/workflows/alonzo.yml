name: Build AlonzoPlayer APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Stiahnutie projektu
        uses: actions/checkout@v4

      - name: Automaticke premenovanie na AlonzoPlayer
        run: |
          find app/src/main/res -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">AlonzoPlayer<\/string>/g' {} +

      - name: Nastavenie Javy 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Povolenie spustenia Gradle
        run: chmod +x ./gradlew

      - name: Kompilacia AlonzoPlayer APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Ulozenie hotovej APK
        uses: actions/upload-artifact@v4
        with:
          name: AlonzoPlayer-v1.0
          path: app/build/outputs/apk/debug/*.apk
